    <script>
      // Suppress Vite HMR WebSocket connection errors in sandbox iframe environment
      window.addEventListener('error', function (e) {
        if (e && (e.message?.includes('WebSocket') || e.message?.includes('@vite/client') || e.filename?.includes('@vite/client'))) {
          e.stopImmediatePropagation();
        }
      });
      window.addEventListener('unhandledrejection', function (e) {
        var msg = e && e.reason ? (e.reason.message || String(e.reason)) : '';
        if (msg.includes('WebSocket') || msg.includes('@vite/client') || msg.includes('createWebSocketModuleRunnerTransport')) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
